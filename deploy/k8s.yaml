# Chat on Kubernetes, with workspaces and each person's browser. ./setup.sh kubernetes
# does everything below for you. By hand: provide an
# external PostgreSQL 17 database with the pgvector extension created in it
# (CREATE EXTENSION vector, as a superuser). Before applying, replace the
# ConfigMap origins, then create the namespace (kubectl create namespace
# obleth-chat) and in it:
#   Secret obleth-chat-env with OBLETH_CHAT_DATABASE_URL and
#     OBLETH_CHAT_BOOTSTRAP_PASSWORD (optional OIDC settings can go here too, and
#     OBLETH_CHAT_METRICS_TOKEN to make /metrics require that bearer token).
#   Secret obleth-chat-gateway-signing-key with a gateway_signing_key PEM file.
# Use the same signing key, origin, issuer, database, and OIDC config on all replicas.
# Expose the ClusterIP service through your existing HTTPS ingress, and configure
# ingress SSE buffering/timeouts. Without OBLETH_CHAT_METRICS_TOKEN, /metrics answers
# only a scraper that reaches the pod or Service directly, not requests the ingress
# passes on; permit that access only from monitoring.
#
# Workspaces and each person's browser run as pods in a namespace of their own,
# obleth-sandboxes: apply deploy/k8s-workspaces.yaml as well, which holds that
# namespace, Chat's permissions in it and its network policies. Chat's service
# account can do nothing in this namespace, where the database and the Secrets
# are. Set OBLETH_CHAT_WORKSPACES=off to leave workspaces out, and skip that file.
#
# An install from 1.9 or earlier runs workspaces in this namespace, under a Role
# and two NetworkPolicies this file used to hold. To keep them and their volumes
# where they are, remove OBLETH_CHAT_SANDBOX_NAMESPACE below before applying;
# ./setup.sh does that for you. Volumes do not move between namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: obleth-chat
  # The API server refuses privileged, root or host-network pods here.
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obleth-chat-config
  namespace: obleth-chat
data:
  OBLETH_CHAT_ORIGIN: https://chat.example.internal
  OBLETH_CHAT_LISTEN: 0.0.0.0:8085
  OBLETH_CHAT_UI_URL: http://obleth-chat-ui:3000
  OBLETH_CHAT_BOOTSTRAP_USERNAME: admin
  OBLETH_CHAT_GATEWAY_URL: http://obleth-gateway.obleth.svc.cluster.local:8080
  OBLETH_CHAT_GATEWAY_ISSUER: https://chat.example.internal
  OBLETH_CHAT_GATEWAY_AUDIENCE: obleth
  OBLETH_CHAT_GATEWAY_SIGNING_KEY_FILE: /run/secrets/obleth-chat/gateway_signing_key
  # Where workspace and browser pods run: the namespace of deploy/k8s-workspaces.yaml.
  OBLETH_CHAT_SANDBOX_NAMESPACE: obleth-sandboxes
  # The addresses your ingress connects from, so sign-in limits apply per
  # client. Check /api/admin/health -> client; see the Reverse proxies docs.
  # OBLETH_CHAT_TRUSTED_PROXY: 10.0.0.10,10.0.0.11
  OBLETH_CHAT_MAX_STREAMS: "128"
  # Database connections per replica. During a roll (replicas + maxSurge) x this
  # must stay under Postgres's max_connections (200 in k8s-postgres.yaml), with
  # room left for backups and administrator sessions.
  OBLETH_CHAT_DB_CONNECTIONS: "20"
  RUST_LOG: obleth_chat=info
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obleth-chat
  namespace: obleth-chat
automountServiceAccountToken: false
# Chat's cluster permissions are all in deploy/k8s-workspaces.yaml: pods and volumes
# in the workspace namespace. It has none here.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obleth-chat
  namespace: obleth-chat
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: obleth-chat
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: obleth-chat
    spec:
      # Its token is how Chat starts workspace and browser pods.
      serviceAccountName: obleth-chat
      automountServiceAccountToken: true
      # The 10 s preStop pause, then up to 45 s for running replies to finish.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat
          image: ghcr.io/thediymaker/obleth-chat/chat:v1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: obleth-chat-config
            - secretRef:
                name: obleth-chat-env
          # Keep serving while the Service drops this pod, so a roll refuses no
          # connection; Chat stops listening only after this.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            # Not /run/secrets itself: the service account token is mounted
            # under /var/run/secrets, and /var/run is /run in the image.
            - name: gateway-key
              mountPath: /run/secrets/obleth-chat
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: gateway-key
          secret:
            secretName: obleth-chat-gateway-signing-key
            defaultMode: 0440
        # Documents and Knowledge files are written here while they are read, up to
        # the 256 MiB of uploads each server holds at once, so it is on disk rather
        # than in memory.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: obleth-chat
  namespace: obleth-chat
spec:
  type: ClusterIP
  selector:
    app: obleth-chat
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: obleth-chat
  namespace: obleth-chat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: obleth-chat
---
# The web interface. Chat is the front door and sends it every page request
# (OBLETH_CHAT_UI_URL), so only Chat's pods reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obleth-chat-ui
  namespace: obleth-chat
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: obleth-chat-ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: obleth-chat-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/thediymaker/obleth-chat/chat-ui:v1.9.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=384
          # Keep serving while the Service drops this pod, so a roll has no gap.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # A page that renders without Chat's API, so the probes test only this server.
          startupProbe:
            httpGet:
              path: /activate/check
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /activate/check
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /activate/check
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: obleth-chat-ui
  namespace: obleth-chat
spec:
  type: ClusterIP
  selector:
    app: obleth-chat-ui
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: obleth-chat-ui
  namespace: obleth-chat
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: obleth-chat-ui
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obleth-chat-ui
  namespace: obleth-chat
spec:
  podSelector:
    matchLabels:
      app: obleth-chat-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: obleth-chat
      ports:
        - {protocol: TCP, port: 3000}
