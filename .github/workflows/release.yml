name: release

# Pushing a vX.Y.Z tag publishes a release: multi-arch images of Chat, the
# workspace and the browser to GHCR, then a GitHub Release with the version's
# CHANGELOG.md section. Prerelease tags (vX.Y.Z-rc.N) publish images without
# moving :latest and mark the release as a prerelease.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/thediymaker/obleth-chat

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          tag="${GITHUB_REF_NAME%%-*}"
          if [ "$tag" != "v$version" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        image: [chat, workspace, browser]
        # Native runners for both architectures: Rust under emulation is far too slow.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - image: chat
            file: deploy/Dockerfile.api
          - image: workspace
            file: deploy/sandbox/Dockerfile
          - image: browser
            file: deploy/browser/Dockerfile
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  # One multi-arch tag per image (:vX.Y.Z, plus :latest for stable releases).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        image: [chat, workspace, browser]
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch manifest
        run: |
          image="$REGISTRY/${{ matrix.image }}"
          tags=(-t "$image:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags+=(-t "$image:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$image:$GITHUB_REF_NAME-amd64" \
            "$image:$GITHUB_REF_NAME-arm64"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{json .Manifest.Digest}}' \
            | tr -d '"' | sed "s|^|$image@|" >> "$RUNNER_TEMP/digest"
          echo "- \`$(cat "$RUNNER_TEMP/digest")\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--verify-tag --title "obleth-chat $GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          # The curated CHANGELOG.md section for this version, or generated notes.
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## v$version" '
            $0 == v { f = 1; next }
            /^## v/ { if (f) exit }
            f { print }
          ' CHANGELOG.md)"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "${args[@]}"
          fi
