name: dev-images

# Every push to dev publishes amd64 images of Chat and the web interface tagged
# dev-<short sha> (and :dev), for the development deployment. Releases still come
# only from version tags (release.yml).
on:
  push:
    branches: [dev]
    paths: ["api/**", "migrations/**", "ui/**", "branding/**", "Cargo.toml", "Cargo.lock", "deploy/Dockerfile.api", "deploy/Dockerfile.ui", ".github/workflows/dev-images.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/thediymaker/obleth-chat

jobs:
  build:
    strategy:
      matrix:
        include:
          - image: chat
            file: deploy/Dockerfile.api
          - image: chat-ui
            file: deploy/Dockerfile.ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: short sha
        run: echo "SHORT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:dev-${{ env.SHORT }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:dev
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.image }}
