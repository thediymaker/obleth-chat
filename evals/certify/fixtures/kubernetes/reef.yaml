# The Kubernetes connection's fixture: apply to the connection's default namespace
# before a run (kubectl -n <namespace> apply -f reef.yaml) and delete it after.
# reef-api is healthy with 2 replicas; reef-worker crash-loops because
# REEF_DB_URL is not set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-api
  labels: { app: reef-api, certify: fixture }
spec:
  replicas: 2
  selector:
    matchLabels: { app: reef-api }
  template:
    metadata:
      labels: { app: reef-api, certify: fixture }
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo reef-api listening on :8080; while true; do sleep 3600; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reef-worker
  labels: { app: reef-worker, certify: fixture }
spec:
  replicas: 1
  selector:
    matchLabels: { app: reef-worker }
  template:
    metadata:
      labels: { app: reef-worker, certify: fixture }
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "reef-worker starting"
              if [ -z "$REEF_DB_URL" ]; then
                echo "FATAL: REEF_DB_URL is not set; cannot connect to the reef database" >&2
                exit 1
              fi
              while true; do sleep 3600; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
